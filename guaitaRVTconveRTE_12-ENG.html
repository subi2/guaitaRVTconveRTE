<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Guaita RVT conveRTE · v1.2</title>
<style>
    :root{ --indigo:#4338ca; --indigo-dark:#3730a3; --amber:#b45309; --amber-bg:#fffbeb; --amber-bd:#fcd34d; --slate:#475569; }
    *{ box-sizing:border-box; }
    body{ margin:0; font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif; background:#f8fafc; color:#1e293b; }
    .mono{ font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
    .wrap{ max-width:640px; margin:32px auto; background:#fff; border-radius:12px; box-shadow:0 10px 15px -3px rgba(0,0,0,.08); overflow:hidden; }
    header{ background:var(--indigo); color:#fff; padding:24px; }
    header h1{ margin:0; font-size:1.35rem; font-weight:700; }
    header p{ margin:8px 0 0; font-size:.85rem; color:#c7d2fe; }
    main{ padding:24px; }
    .drop{ display:flex; flex-direction:column; align-items:center; gap:12px; border:2px dashed #cbd5e1; border-radius:12px; padding:44px 28px; text-align:center; cursor:pointer; background:#fafbfc; transition:border-color .15s, background .15s, transform .1s; }
    .drop:hover{ border-color:var(--indigo); background:#eef2ff; }
    .drop.drag{ border-color:var(--indigo); border-style:solid; background:#e0e7ff; transform:scale(1.01); }
    .drop input{ display:none; }
    .drop > *{ pointer-events:none; }
    .drop svg{ width:44px; height:44px; color:#94a3b8; transition:color .15s; }
    .drop:hover svg, .drop.drag svg{ color:var(--indigo); }
    .drop-label{ font-size:.95rem; color:#475569; }
    .drop-label b{ color:var(--indigo); }
    .drop-hint{ font-size:.75rem; color:#94a3b8; }
    .drop-exts{ display:flex; gap:8px; }
    .drop-exts span{ font-family:ui-monospace,Menlo,Consolas,monospace; font-size:.7rem; font-weight:700; padding:2px 10px; border-radius:6px; }
    .drop-exts .e-rvt{ background:#e0e7ff; color:var(--indigo-dark); }
    .drop-exts .e-rte{ background:#fef3c7; color:var(--amber); }
    .card{ margin-top:20px; border:1px solid #e2e8f0; border-radius:10px; padding:16px 18px; }
    .preview{ margin-top:20px; display:flex; align-items:stretch; gap:12px; }
    .pv-side{ flex:1; min-width:0; display:flex; flex-direction:column; align-items:center; gap:8px; border:1px solid #e2e8f0; border-radius:10px; padding:14px 12px; background:#fafbfc; }
    .pv-to{ border-color:#c7d2fe; background:#f5f7ff; }
    .pv-name{ font-size:.85rem; font-weight:600; word-break:break-all; text-align:center; }
    .pv-arrow{ align-self:center; font-size:1.4rem; color:var(--indigo); font-weight:700; }
    .pv-edit{ display:flex; align-items:center; width:100%; }
    .pv-edit input{ flex:1; min-width:0; font-size:.85rem; font-weight:600; padding:6px 8px; border:1px solid #cbd5e1; border-radius:6px 0 0 6px; border-right:0; color:#1e293b; outline:none; }
    .pv-edit input:focus{ border-color:var(--indigo); }
    .pv-ext{ font-size:.85rem; font-weight:700; padding:6px 10px; border:1px solid #cbd5e1; border-radius:0 6px 6px 0; background:#eef2ff; color:var(--indigo-dark); }
    .badge{ display:inline-block; padding:2px 8px; border-radius:6px; font-size:.7rem; font-weight:700; letter-spacing:.04em; }
    .badge.rvt{ background:#e0e7ff; color:var(--indigo-dark); }
    .badge.rte{ background:#fef3c7; color:var(--amber); }
    .details{ margin-top:12px; font-size:.75rem; color:#64748b; line-height:1.6; }
    .warn{ margin-top:18px; background:var(--amber-bg); border:1px solid var(--amber-bd); border-radius:8px; padding:12px 14px; font-size:.8rem; color:#92400e; line-height:1.5; }
    .err{ margin-top:18px; background:#fef2f2; border:1px solid #fecaca; border-radius:8px; padding:12px 14px; font-size:.85rem; color:#b91c1c; }
    button.convert{ margin-top:18px; width:100%; background:var(--indigo); color:#fff; border:0; border-radius:8px; padding:12px; font-size:.95rem; font-weight:700; cursor:pointer; transition:background .15s; }
    button.convert:hover{ background:var(--indigo-dark); }
    button.convert:disabled{ background:#94a3b8; cursor:not-allowed; }
    .ok{ margin-top:14px; background:#ecfdf5; border:1px solid #a7f3d0; color:#065f46; border-radius:8px; padding:12px 14px; font-size:.85rem; }
    footer{ display:flex; justify-content:space-between; align-items:flex-end; gap:16px; padding:8px 16px 12px; font-size:11px; color:#94a3b8; letter-spacing:.04em; }
    footer a{ color:#6366f1; text-decoration:none; }
</style>
</head>
<body>
<div class="wrap">
    <header>
        <h1>Guaita RVT conveRTE</h1>
        <p>Change the internal type of an RVT/RTE file (project ⇄ template).</p>
    </header>
    <main>
        <label class="drop" id="drop">
            <input type="file" id="file-input" accept=".rvt,.rte">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/>
                <polyline points="17 8 12 3 7 8"/>
                <line x1="12" y1="3" x2="12" y2="15"/>
            </svg>
            <div class="drop-label">Drag the file here, or <b>click to select it</b></div>
            <div class="drop-exts"><span class="e-rvt">.rvt</span><span class="e-rte">.rte</span></div>
            <div class="drop-hint">The file is processed locally in your browser — it is never sent anywhere</div>
        </label>

        <div id="result"></div>
    </main>
    <footer>
        <span>About Guaita RVT conveRTE</span>
        <span>SBS BIM Consulting 2026</span>
    </footer>
</div>

<script>
// =========================================================================
//  ENGINE: OLE2/CFBF parser (identical to Guaita Historial) + write path
// =========================================================================
const NOSTREAM = 0xFFFFFFFF, ENDOFCHAIN = 0xFFFFFFFE, FREESECT = 0xFFFFFFFF;
const OLE_SIG = [0xD0, 0xCF, 0x11, 0xE0, 0xA1, 0xB1, 0x1A, 0xE1];

class CFB {
    constructor(arrayBuffer) {
        this.dv = new DataView(arrayBuffer);
        this.bytes = new Uint8Array(arrayBuffer);
        for (let i = 0; i < 8; i++)
            if (this.bytes[i] !== OLE_SIG[i]) throw new Error("Not a valid OLE2/CFBF file.");
        this.sectorShift  = this.dv.getUint16(30, true);
        this.miniShift    = this.dv.getUint16(32, true);
        this.sectorSize   = 1 << this.sectorShift;
        this.miniSize     = 1 << this.miniShift;
        this.firstDir     = this.dv.getInt32(48, true);
        this.miniCutoff   = this.dv.getUint32(56, true);
        this.firstMiniFAT = this.dv.getInt32(60, true);
        this.firstDIFAT   = this.dv.getInt32(68, true);
        this.numDIFAT     = this.dv.getUint32(72, true);
        this._readDIFAT(); this._readFAT(); this._readDir();
        this._readMiniFAT(); this._readMiniStream();
    }
    _secOff(n) { return (n + 1) * this.sectorSize; }
    _sector(n) { const o = this._secOff(n); return this.bytes.subarray(o, o + this.sectorSize); }
    _readDIFAT() {
        this.difat = [];
        for (let i = 0; i < 109; i++) {
            const v = this.dv.getUint32(76 + i * 4, true);
            if (v !== FREESECT) this.difat.push(v);
        }
        let sec = this.firstDIFAT, n = this.numDIFAT, guard = 0;
        const perSec = this.sectorSize / 4;
        while (n > 0 && sec >= 0 && sec !== ENDOFCHAIN && guard++ < 1e5) {
            const base = this._secOff(sec);
            for (let i = 0; i < perSec - 1; i++) {
                const v = this.dv.getUint32(base + i * 4, true);
                if (v !== FREESECT) this.difat.push(v);
            }
            sec = this.dv.getUint32(base + (perSec - 1) * 4, true); n--;
        }
    }
    _readFAT() {
        const perSec = this.sectorSize / 4;
        this.fat = new Uint32Array(this.difat.length * perSec);
        let w = 0;
        for (const s of this.difat) {
            const base = this._secOff(s);
            for (let i = 0; i < perSec; i++) this.fat[w++] = this.dv.getUint32(base + i * 4, true);
        }
    }
    _chain(start) {
        const out = []; let s = start, guard = 0;
        while (s !== ENDOFCHAIN && s !== FREESECT && s >= 0 && s < this.fat.length && guard++ < 1e7) {
            out.push(s); s = this.fat[s];
        }
        return out;
    }
    _readChainBytes(start) {
        const secs = this._chain(start);
        const out = new Uint8Array(secs.length * this.sectorSize);
        secs.forEach((s, i) => out.set(this._sector(s), i * this.sectorSize));
        return out;
    }
    _readDir() {
        const dirBytes = this._readChainBytes(this.firstDir);
        const dv = new DataView(dirBytes.buffer, dirBytes.byteOffset, dirBytes.byteLength);
        const dec = new TextDecoder("utf-16le");
        this.dir = [];
        for (let off = 0; off + 128 <= dirBytes.length; off += 128) {
            const nameLen = dv.getUint16(off + 64, true);
            const type = dirBytes[off + 66];
            let name = "";
            if (nameLen >= 2) name = dec.decode(dirBytes.subarray(off, off + nameLen - 2));
            this.dir.push({
                name, type,
                left:  dv.getUint32(off + 68, true),
                right: dv.getUint32(off + 72, true),
                child: dv.getUint32(off + 76, true),
                start: dv.getUint32(off + 116, true),
                size:  dv.getUint32(off + 120, true) + dv.getUint32(off + 124, true) * 4294967296,
            });
        }
    }
    _readMiniFAT() {
        if (this.firstMiniFAT === ENDOFCHAIN || this.firstMiniFAT < 0) { this.minifat = new Uint32Array(0); return; }
        const b = this._readChainBytes(this.firstMiniFAT);
        this.minifat = new Uint32Array(b.buffer, b.byteOffset, Math.floor(b.byteLength / 4));
    }
    _readMiniStream() {
        const root = this.dir.find(e => e.type === 5);
        this.root = root;
        if (!root || root.start === ENDOFCHAIN) { this.miniStream = new Uint8Array(0); return; }
        this.miniStream = this._readChainBytes(root.start).subarray(0, root.size);
    }
    _readMiniChainBytes(start, size) {
        const out = new Uint8Array(Math.ceil(size / this.miniSize) * this.miniSize);
        let m = start, w = 0, guard = 0;
        while (m !== ENDOFCHAIN && m >= 0 && m < this.minifat.length && guard++ < 1e7) {
            const o = m * this.miniSize;
            out.set(this.miniStream.subarray(o, o + this.miniSize), w);
            w += this.miniSize; m = this.minifat[m];
        }
        return out.subarray(0, size);
    }
    readByName(name) {
        const e = this.dir.find(d => d.type === 2 && d.name === name);
        if (!e) return null;
        if (e.size >= this.miniCutoff) return this._readChainBytes(e.start).subarray(0, e.size);
        return this._readMiniChainBytes(e.start, e.size);
    }

    // ---- write path: locates the real physical offset inside the original ArrayBuffer ----
    _miniChain(start) {
        const out = []; let s = start, guard = 0;
        while (s !== ENDOFCHAIN && s !== FREESECT && s >= 0 && s < this.minifat.length && guard++ < 1e7) {
            out.push(s); s = this.minifat[s];
        }
        return out;
    }
    _physicalOffset(name, relOffset) {
        const e = this.dir.find(d => d.type === 2 && d.name === name);
        if (!e) throw new Error(`Stream "${name}" not found.`);
        if (e.size >= this.miniCutoff) {
            const chain = this._chain(e.start);
            const secIdx = Math.floor(relOffset / this.sectorSize);
            if (secIdx >= chain.length) throw new Error("Offset out of stream range.");
            return this._secOff(chain[secIdx]) + (relOffset % this.sectorSize);
        } else {
            const miniChain = this._miniChain(e.start);
            const miniIdx = Math.floor(relOffset / this.miniSize);
            if (miniIdx >= miniChain.length) throw new Error("Offset out of mini-stream range.");
            const posInRoot = miniChain[miniIdx] * this.miniSize + (relOffset % this.miniSize);
            const rootChain = this._chain(this.root.start);
            const secIdx = Math.floor(posInRoot / this.sectorSize);
            if (secIdx >= rootChain.length) throw new Error("Offset out of root stream range.");
            return this._secOff(rootChain[secIdx]) + (posInRoot % this.sectorSize);
        }
    }
    writeBytes(name, relOffset, bytesArray) {
        for (let k = 0; k < bytesArray.length; k++) {
            const off = this._physicalOffset(name, relOffset + k);
            this.bytes[off] = bytesArray[k];
        }
    }
}

// =========================================================================
//  Document type detection and patch.
//  Verified by exhaustive diff between a .rvt and a .rte of the same model:
//  all element content (gzip chunks in Partitions) is identical bit for bit;
//  the only type marker in the whole file is the extension stored in the
//  "Last Save Path" inside BasicFileInfo (it appears twice, in UTF-16LE).
//  The conversion replaces ".rvt" ⇄ ".rte" in place (same length,
//  4 physical bytes, without touching the FAT or any history counter).
// =========================================================================
function utf16(s) {
    const out = new Uint8Array(s.length * 2);
    for (let i = 0; i < s.length; i++) { out[i*2] = s.charCodeAt(i) & 0xff; out[i*2+1] = s.charCodeAt(i) >> 8; }
    return out;
}
function findAll(hay, needle) {
    const out = [];
    outer: for (let i = 0; i + needle.length <= hay.length; i++) {
        for (let j = 0; j < needle.length; j++) if (hay[i+j] !== needle[j]) continue outer;
        out.push(i);
    }
    return out;
}
function detectKind(cfb) {
    const bfi = cfb.readByName("BasicFileInfo");
    if (!bfi) return null;
    const occ = {};
    for (const ext of ['.rvt', '.rte', '.RVT', '.RTE']) {
        const hits = findAll(bfi, utf16(ext));
        if (hits.length) occ[ext.toLowerCase()] = (occ[ext.toLowerCase()] || []).concat(hits);
    }
    const hasRvt = !!occ['.rvt'], hasRte = !!occ['.rte'];
    if (hasRvt === hasRte) return null; // no occurrence, or inconsistent mix
    return { kind: hasRvt ? 1 : 2, occ };
}
function applyKindPatch(cfb, target) {
    const bfi = cfb.readByName("BasicFileInfo");
    const from = target === 1 ? '.rte' : '.rvt';
    const to   = target === 1 ? '.rvt' : '.rte';
    let patched = 0;
    for (const [f, t] of [[from, to], [from.toUpperCase(), to.toUpperCase()]]) {
        for (const off of findAll(bfi, utf16(f))) {
            cfb.writeBytes("BasicFileInfo", off, utf16(t));
            patched++;
        }
    }
    if (!patched) throw new Error("No occurrence of the extension found inside BasicFileInfo.");
    return patched;
}

// =========================================================================
//  UI
// =========================================================================
const dropEl = document.getElementById('drop');
const inputEl = document.getElementById('file-input');
const resultEl = document.getElementById('result');

['dragover','dragenter'].forEach(ev => dropEl.addEventListener(ev, e => { e.preventDefault(); dropEl.classList.add('drag'); }));
['dragleave','drop'].forEach(ev => dropEl.addEventListener(ev, e => { dropEl.classList.remove('drag'); }));
dropEl.addEventListener('drop', e => {
    e.preventDefault();
    if (e.dataTransfer.files.length) { inputEl.files = e.dataTransfer.files; handleFile(e.dataTransfer.files[0]); }
});
inputEl.addEventListener('change', () => { if (inputEl.files.length) handleFile(inputEl.files[0]); });

function fmtSize(b) { return (b / (1024*1024)).toFixed(1) + ' MB'; }

async function handleFile(file) {
    resultEl.innerHTML = '';
    let buf;
    try {
        buf = await file.arrayBuffer();
    } catch (e) {
        resultEl.innerHTML = `<div class="err">The file could not be read: ${e.message}</div>`;
        return;
    }

    let cfb, det;
    try {
        cfb = new CFB(buf);
        det = detectKind(cfb);
    } catch (e) {
        resultEl.innerHTML = `<div class="err">${e.message}</div>`;
        return;
    }
    if (!det) {
        resultEl.innerHTML = `<div class="err">The type could not be determined: no extension (or contradictory extensions) inside the Last Save Path of BasicFileInfo.</div>`;
        return;
    }

    const kindNow = det.kind;               // 1 = projecte (rvt), 2 = plantilla (rte)
    const kindTarget = kindNow === 1 ? 2 : 1;
    const badgeNow = kindNow === 1 ? '<span class="badge rvt">PROJECT · RVT</span>' : '<span class="badge rte">TEMPLATE · RTE</span>';
    const badgeTarget = kindTarget === 1 ? '<span class="badge rvt">PROJECT · RVT</span>' : '<span class="badge rte">TEMPLATE · RTE</span>';
    const baseName = file.name.replace(/\.(rvt|rte)$/i, '');
    const targetExt = kindTarget === 1 ? '.rvt' : '.rte';
    const actionLabel = kindTarget === 1 ? 'Convert to project (.rvt)' : 'Convert to template (.rte)';

    resultEl.innerHTML = `
        <div class="card">
            <div class="details mono">
                Size: ${fmtSize(file.size)}<br>
                Type detected from the Last Save Path (BasicFileInfo): "${det.kind === 1 ? '.rvt' : '.rte'}" at offsets ${(det.occ[det.kind === 1 ? '.rvt' : '.rte']).join(', ')}
            </div>
        </div>
        <div class="preview">
            <div class="pv-side pv-from">
                <div class="pv-name mono">${file.name}</div>
                ${badgeNow}
            </div>
            <div class="pv-arrow">→</div>
            <div class="pv-side pv-to">
                <div class="pv-edit">
                    <input type="text" id="out-base" class="mono" value="${baseName.replace(/"/g,'&quot;')}" spellcheck="false">
                    <span class="pv-ext mono">${targetExt}</span>
                </div>
                ${badgeTarget}
            </div>
        </div>
        <div class="warn">
            Experimental tool for educational purposes only. The patch replaces the extension inside the Last Save Path of <span class="mono">BasicFileInfo</span> (4 bytes), without touching the save history or any counter, and changes the file extension — Always verify the result by opening it in the authoring application.
        </div>
        <button class="convert" id="btn-convert"></button>
        <div id="convert-status"></div>
    `;

    const baseInput = document.getElementById('out-base');
    const btn = document.getElementById('btn-convert');
    const outName = () => (baseInput.value.trim() || baseName) + targetExt;
    const refreshBtn = () => { btn.textContent = `${actionLabel} → ${outName()}`; };
    baseInput.addEventListener('input', refreshBtn);
    refreshBtn();

    btn.addEventListener('click', () => doConvert(buf, kindTarget, outName()));
}

function doConvert(buf, targetKind, outName) {
    const statusEl = document.getElementById('convert-status');
    const btn = document.getElementById('btn-convert');
    btn.disabled = true;
    try {
        const cfb = new CFB(buf);
        applyKindPatch(cfb, targetKind);

        // cold verification: re-parse the structure over the same mutated buffer
        const check = new CFB(buf);
        const det2 = detectKind(check);
        if (!det2 || det2.kind !== targetKind) {
            throw new Error('Post-patch verification failed: the type marker was not updated correctly.');
        }

        const blob = new Blob([buf], { type: 'application/octet-stream' });
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url; a.download = outName;
        document.body.appendChild(a); a.click(); document.body.removeChild(a);
        URL.revokeObjectURL(url);

        statusEl.innerHTML = `<div class="ok">Done — downloaded as <b>${outName}</b>. The type marker was verified after the patch.</div>`;
    } catch (e) {
        statusEl.innerHTML = `<div class="err">${e.message}</div>`;
    } finally {
        btn.disabled = false;
    }
}
</script>
</body>
</html>
